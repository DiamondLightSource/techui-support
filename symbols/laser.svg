<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Beam -->
  <line x1="8" y1="32" x2="28" y2="32"></line>

  <!-- Laser emission -->
  <circle cx="32" cy="32" r="1.8"></circle>

  <!-- Long rays -->
  <line x1="32" y1="18" x2="32" y2="26"></line>
  <line x1="32" y1="38" x2="32" y2="46"></line>
  <line x1="18" y1="32" x2="26" y2="32"></line>
  <line x1="38" y1="32" x2="46" y2="32"></line>

  <!-- Diagonals -->
  <line x1="22.1" y1="22.1" x2="27.7" y2="27.7"></line>
  <line x1="36.3" y1="36.3" x2="41.9" y2="41.9"></line>
  <line x1="22.1" y1="41.9" x2="27.7" y2="36.3"></line>
  <line x1="36.3" y1="27.7" x2="41.9" y2="22.1"></line>

  <!-- Short rays -->
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(22.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(67.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(112.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(157.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(202.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(247.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(292.5 32 32)"></line>
  <line x1="32" y1="22" x2="32" y2="26" transform="rotate(337.5 32 32)"></line>

  <!-- Outgoing beam -->
  <line x1="36" y1="32" x2="56" y2="32"></line>
</svg>